<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Atlas doctrinal de la pensée économique : questionnaire adaptatif, 19 écoles, 57 économistes, 12 dimensions. Calcul local, aucune réponse transmise."/>
<link rel="canonical" href="https://s-geffroy.github.io/economic-doctrine-atlas/"/>
<title>Atlas doctrinal économique — ligne de crête</title>
<script>
/* Applique le theme memorise avant le premier rendu : pas de flash.
   Meme cle que ligne-de-crete.fr, `ldc-theme`, par convention. */
try {
  var p = localStorage.getItem('ldc-theme');
  if (p === 'light' || p === 'dark') document.documentElement.dataset.theme = p;
  else document.documentElement.dataset.theme =
    window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
